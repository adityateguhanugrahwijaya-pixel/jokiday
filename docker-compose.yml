version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: jokiday-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jokiday
      POSTGRES_PASSWORD: jokiday_secret_password
      POSTGRES_DB: jokiday
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: jokiday-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
